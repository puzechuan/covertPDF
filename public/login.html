<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 / 注册 - PDF 工具箱</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg:#f5f6fa; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280; --accent:#4f46e5; --danger:#dc2626; --ok:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; }
  .wrap { max-width:460px; margin:0 auto; padding:48px 18px 30px; }
  header { text-align:center; margin-bottom:22px; }
  h1 { font-size:26px; margin:0 0 4px; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow:0 10px 30px rgba(17,24,39,.05); }
  .tabs { display:flex; gap:8px; margin-bottom:20px; }
  .tab { flex:1; border:1px solid var(--line); background:#fff; color:var(--muted); padding:9px; border-radius:9px; cursor:pointer; font-size:14px; }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input[type=email], input[type=text] { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-family:inherit; font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 2px #eef2ff; }
  .captcha-row { display:flex; gap:8px; align-items:center; }
  .captcha-row input { flex:1; }
  .captcha-row img { width:150px; height:48px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:#f8fafc; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  button { font-family:inherit; }
  .btn { border:0; background:var(--accent); color:#fff; font-weight:600; padding:10px 14px; border-radius:9px; cursor:pointer; font-size:14px; white-space:nowrap; }
  .btn:hover:not(:disabled) { background:#4338ca; }
  .btn:disabled { opacity:.55; cursor:wait; }
  .btn.block { width:100%; margin-top:20px; padding:11px; }
  .status { margin-top:14px; min-height:22px; font-size:13px; color:var(--muted); }
  .status.error { color:var(--danger); }
  .status.success { color:var(--ok); }
  .signed { text-align:center; padding:10px 0; }
  .signed h2 { font-size:18px; margin:0 0 6px; }
  .signed p { color:var(--muted); font-size:13px; word-break:break-all; }
  .signed .links { display:flex; gap:10px; justify-content:center; margin-top:18px; }
  a.btn { display:inline-block; text-decoration:none; text-align:center; }
  .btn.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>PDF 工具箱</h1><a href="/">← 返回首页</a></header>
  <div class="card">
    <div id="authView">
      <div class="tabs">
        <button type="button" class="tab active" data-mode="login">登录</button>
        <button type="button" class="tab" data-mode="register">注册</button>
      </div>
      <label for="email">邮箱</label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
      <label for="code">图片验证码</label>
      <div class="captcha-row">
        <input type="text" id="code" placeholder="请输入图中字符" autocomplete="off">
        <img id="captchaImg" alt="点击更换验证码" title="点击更换验证码">
      </div>
      <div class="hint">不区分大小写；看不清可点击图片更换一张。</div>
      <button type="button" class="btn block" id="submitBtn">登录</button>
      <div class="status" id="status"></div>
    </div>
    <div class="signed" id="signedView" hidden>
      <h2>已登录</h2>
      <p id="signedEmail"></p>
      <div class="links">
        <a class="btn ghost" href="/">返回首页</a>
        <a class="btn ghost" href="/admin">用户管理</a>
      </div>
      <button type="button" class="btn block" id="signOutBtn" style="background:#fff;color:var(--muted);border:1px solid var(--line)">退出登录</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var emailEl = document.getElementById('email');
  var codeEl = document.getElementById('code');
  var captchaImg = document.getElementById('captchaImg');
  var submitBtn = document.getElementById('submitBtn');
  var statusEl = document.getElementById('status');
  var authView = document.getElementById('authView');
  var signedView = document.getElementById('signedView');
  var signedEmail = document.getElementById('signedEmail');
  var signOutBtn = document.getElementById('signOutBtn');
  var mode = 'login';
  var settings = { registrationEnabled: true, initialized: true };
  var captchaToken = '';

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {}));
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || ('请求失败（HTTP ' + res.status + '）'));
    return data;
  }

  async function loadCaptcha() {
    try {
      var res = await api('/auth/captcha');
      captchaToken = res.token;
      captchaImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(res.svg);
      codeEl.value = '';
    } catch (e) { setStatus('加载验证码失败：' + e.message, 'error'); }
  }

  function showSigned(user) {
    authView.hidden = true;
    signedView.hidden = false;
    signedEmail.textContent = user.email || '已登录账号';
  }

  async function load() {
    try {
      settings = await api('/auth/settings');
      if (!settings.initialized) {
        window.location.replace('/init');
        return;
      }
      var me = await api('/auth/me');
      if (me.user) showSigned(me.user);
    } catch (e) { setStatus(e.message, 'error'); }
    loadCaptcha();
  }

  captchaImg.addEventListener('click', loadCaptcha);

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.addEventListener('click', function () {
      mode = tab.dataset.mode;
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) { t.classList.toggle('active', t === tab); });
      submitBtn.textContent = mode === 'login' ? '登录' : '注册';
      setStatus('');
      loadCaptcha();
    });
  });

  submitBtn.addEventListener('click', async function () {
    var email = emailEl.value.trim();
    var code = codeEl.value.trim();
    if (!email || !code) { setStatus('请填写邮箱和图片验证码。', 'error'); return; }
    if (mode === 'register' && !settings.registrationEnabled) { setStatus('当前已关闭用户注册。', 'error'); return; }
    submitBtn.disabled = true;
    setStatus('正在验证…');
    try {
      var res = await api(mode === 'login' ? '/auth/login' : '/auth/register', {
        method: 'POST',
        body: JSON.stringify({ email: email, captchaToken: captchaToken, captchaCode: code })
      });
      showSigned(res.user);
    } catch (e) {
      setStatus('验证失败：' + e.message, 'error');
      loadCaptcha();
    }
    submitBtn.disabled = false;
  });

  signOutBtn.addEventListener('click', async function () {
    try { await api('/auth/logout', { method: 'POST' }); } catch (e) {}
    signedView.hidden = true;
    authView.hidden = false;
    setStatus('已退出登录。', 'success');
  });

  load();
})();
</script>
</body>
</html>
