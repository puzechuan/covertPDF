<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF合并</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --line: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
    --ok: #059669;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 20px 32px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
  }
  .dropzone {
    border: 2px dashed #c7d2fe;
    border-radius: 14px;
    background: #fafaff;
    padding: 38px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone svg { width: 42px; height: 42px; color: var(--accent); }
  .dropzone strong { display: block; margin-top: 10px; font-size: 16px; }
  .dropzone span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  input[type=file] { display: none; }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 24px 0 8px; font-size: 13px; color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .empty {
    border: 1px dashed var(--line); border-radius: 10px;
    padding: 20px; text-align: center; color: #9ca3af; font-size: 14px;
  }
  .file-card {
    border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; background: #fff; overflow: hidden;
  }
  .file-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .page-panel { border-top: 1px dashed var(--line); background: #fafaff; padding: 10px 12px 12px; }
  .page-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .mini {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .mini:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .mini:disabled { opacity: .5; cursor: not-allowed; }
  .range-input {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
    font-size: 12px; width: 110px; font-family: inherit; color: var(--text);
  }
  .range-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
  .range-input::placeholder { color: #9ca3af; }
  .pages { display: flex; flex-wrap: wrap; gap: 6px; }
  .page-chip {
    min-width: 30px; height: 28px; padding: 0 7px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .page-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .page-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-chip.on:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .page-chip:disabled { cursor: not-allowed; opacity: .6; }
  .page-hint { font-size: 12px; color: var(--muted); }
  .page-hint.bad { color: var(--danger); }
  .idx {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-dark);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .size { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 4px; }
  button { font-family: inherit; }
  .icon {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 14px;
    line-height: 1; display: grid; place-items: center;
  }
  .icon:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .icon:disabled { opacity: .35; cursor: not-allowed; }
  .icon.remove:hover { border-color: var(--danger); color: var(--danger); }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line);
  }
  .summary { font-size: 13px; color: var(--muted); }
  .bar-right { display: flex; gap: 10px; align-items: center; }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 9px 16px; border-radius: 9px; cursor: pointer; font-size: 14px;
  }
  .ghost:hover:not(:disabled) { color: var(--text); border-color: #9ca3af; }
  .ghost:disabled { opacity: .5; cursor: not-allowed; }
  .primary {
    border: 0; background: var(--accent); color: #fff; font-weight: 600;
    padding: 10px 22px; border-radius: 9px; cursor: pointer; font-size: 14px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, .25);
  }
  .primary:hover:not(:disabled) { background: var(--accent-dark); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 16px; font-size: 14px; min-height: 22px; }
  .status.info { color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.success { color: var(--ok); }
  .progress {
    height: 4px; border-radius: 999px; background: #eef2ff;
    overflow: hidden; margin-top: 10px; display: none;
  }
  .progress.on { display: block; }
  .progress i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #6366f1, #4f46e5);
    transition: width .2s ease;
  }
  .result {
    margin-top: 14px; padding: 16px; border-radius: 10px;
    background: #ecfdf5; border: 1px solid #a7f3d0; font-size: 14px;
  }
  .result a { color: var(--ok); font-weight: 700; text-decoration: none; }
  .result a:hover { text-decoration: underline; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 22px; line-height: 1.8; }
  @media (max-width: 600px) {
    .wrap { padding: 28px 14px; }
    .card { padding: 18px; }
    .bar { flex-direction: column; align-items: stretch; }
    .bar-right { justify-content: flex-end; }
    .file-item { gap: 9px; }
    .actions { gap: 3px; }
    .icon { width: 27px; height: 27px; font-size: 13px; border-radius: 6px; }
    .size { font-size: 11px; }
    .range-input { width: 96px; }
  }
</style>
<style>body.auth-gate { visibility: hidden; }</style>
</head>
<body class="auth-gate">
<div class="wrap">
  <header>
    <h1>PDF合并</h1>
    <p><a href="/" style="color:var(--accent);text-decoration:none">← 返回 PDF 工具箱</a></p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M12 18v-6"></path><path d="m9 15 3-3 3 3"></path>
      </svg>
      <strong>拖拽 PDF 到此处，或点击选择文件</strong>
      <span>可多选，展开文件可勾选要合并的页面（默认全选）</span>
    </div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple>

    <div class="list-head"><span>文件列表</span><span id="count">0 个文件</span></div>
    <div id="empty" class="empty">还没有添加文件</div>
    <ul id="fileList"></ul>

    <div class="bar">
      <div class="summary" id="summary">总大小 0 B</div>
      <div class="bar-right">
        <button type="button" class="ghost" id="clearBtn">清空</button>
        <button type="button" class="primary" id="mergeBtn">开始合并</button>
      </div>
    </div>

    <div class="status info" id="status"></div>
    <div class="progress" id="progress"><i id="progressBar"></i></div>
    <div class="result" id="result" hidden>
      ✓ 合并完成！<a id="downloadLink" href="#" download="merged.pdf">下载合并后的 PDF</a>
    </div>
  </div>

  <footer>
    默认合并全部页面，可展开文件单独选择 · 文件只在浏览器本地处理，不会上传<br>
    不限制文件大小与数量，只取决于本机内存与浏览器能力 · 加密 PDF 请先解除密码
  </footer>
</div>

<script src="/vendor/pdf-lib.min.js"></script>
<script>
(function () {
  var input = document.getElementById('fileInput');
  var dropzone = document.getElementById('dropzone');
  var list = document.getElementById('fileList');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var summary = document.getElementById('summary');
  var mergeBtn = document.getElementById('mergeBtn');
  var clearBtn = document.getElementById('clearBtn');
  var statusEl = document.getElementById('status');
  var progressEl = document.getElementById('progress');
  var progressBar = document.getElementById('progressBar');
  var result = document.getElementById('result');
  var downloadLink = document.getElementById('downloadLink');

  // entries: { id, file, pages, selected(Set|null), countError, counting, expanded, rangeText, rangeError }
  var entries = [];
  var nextId = 1;
  var objectUrl = null;
  var dragDepth = 0;
  var merging = false;
  var counting = 0;

  // 浏览器合并的瓶颈是内存，超过这个总量时提醒用户（不阻止）。
  var BIG_TOTAL_BYTES = 300 * 1024 * 1024;
  // 超过这个大小的文件不在后台预读页数，展开文件或开始合并时再读。
  var AUTO_COUNT_LIMIT = 200 * 1024 * 1024;

  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function timestamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + (kind || 'info');
  }

  function setProgress(ratio) {
    if (ratio === null) {
      progressEl.classList.remove('on');
      progressBar.style.width = '0%';
      return;
    }
    progressEl.classList.add('on');
    progressBar.style.width = Math.max(0, Math.min(1, ratio)) * 100 + '%';
  }

  function allPages(n) {
    var s = new Set();
    for (var p = 1; p <= n; p++) s.add(p);
    return s;
  }

  function selectedCount(entry) {
    return entry.selected ? entry.selected.size : (entry.pages || 0);
  }

  // ---------- 页码范围 ----------
  // 支持 "1-3,5" / "1~3 5" / 全角数字；返回 1 基页码集合。
  function parseRange(text, total) {
    var raw = String(text == null ? '' : text).trim();
    if (!raw) return { pages: new Set(), error: '请先输入页码' };

    var parts = raw
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
      .replace(/[，、;；\/\s]+/g, ',')
      .split(',')
      .filter(Boolean);

    var pages = new Set();
    for (var i = 0; i < parts.length; i++) {
      var m = /^(\d+)\s*(?:[-~—–至]\s*(\d+))?$/.exec(parts[i]);
      if (!m) return { pages: pages, error: '格式应形如 1-3,5' };
      var a = parseInt(m[1], 10);
      var b = m[2] ? parseInt(m[2], 10) : a;
      if (!a || !b) return { pages: pages, error: '页码从 1 开始' };
      if (a > b) { var t = a; a = b; b = t; }
      if (b > total) return { pages: pages, error: '超出范围（共 ' + total + ' 页）' };
      for (var p = a; p <= b; p++) pages.add(p);
    }
    if (!pages.size) return { pages: pages, error: '没有选中任何页' };
    return { pages: pages, error: '' };
  }

  // ---------- 渲染 ----------
  function render() {
    list.innerHTML = '';
    empty.hidden = entries.length > 0;
    count.textContent = entries.length + ' 个文件';

    var settled = entries.every(function (e) { return e.pages !== null && !e.counting; });
    var selected = entries.reduce(function (n, e) { return n + selectedCount(e); }, 0);
    var text = '总大小 ' + fmt(entries.reduce(function (n, e) { return n + e.file.size; }, 0));
    if (entries.length) text += settled ? ' · 已选 ' + selected + ' 页' : ' · 正在读取页数…';
    summary.textContent = text;

    entries.forEach(function (entry, i) {
      var li = document.createElement('li');
      li.className = 'file-card';
      li.dataset.id = String(entry.id);
      var expanded = !!entry.expanded;
      var pageInfo = entry.pages === null
        ? (entry.counting ? '正在读取页数…' : (entry.countError ? entry.countError + '（按全部页合并）' : '等待读取页数…'))
        : (entry.pages ? '共 ' + entry.pages + ' 页 · 已选 ' + selectedCount(entry) + ' 页' : '空文件（无可合并页面）');

      var html =
        '<div class="file-item">' +
          '<span class="idx">' + (i + 1) + '</span>' +
          '<div class="meta"><div class="name" title="' + escapeHtml(entry.file.name) + '">' + escapeHtml(entry.file.name) + '</div>' +
          '<div class="size">' + fmt(entry.file.size) + ' · ' + escapeHtml(pageInfo) + '</div></div>' +
          '<div class="actions">' +
            '<button type="button" class="icon" data-act="toggle" data-i="' + i + '" title="选择页面"' + (merging ? ' disabled' : '') + '>' + (expanded ? '▾' : '▸') + '</button>' +
            '<button type="button" class="icon" data-act="up" data-i="' + i + '" title="上移"' + (i === 0 || merging ? ' disabled' : '') + '>↑</button>' +
            '<button type="button" class="icon" data-act="down" data-i="' + i + '" title="下移"' + (i === entries.length - 1 || merging ? ' disabled' : '') + '>↓</button>' +
            '<button type="button" class="icon remove" data-act="remove" data-i="' + i + '" title="移除"' + (merging ? ' disabled' : '') + '>×</button>' +
          '</div>' +
        '</div>';

      if (expanded) {
        if (entry.pages) {
          var chips = '';
          for (var p = 1; p <= entry.pages; p++) {
            chips += '<button type="button" class="page-chip' + (entry.selected && entry.selected.has(p) ? ' on' : '') +
              '" data-act="page" data-i="' + i + '" data-p="' + p + '"' + (merging ? ' disabled' : '') + '>' + p + '</button>';
          }
          html +=
            '<div class="page-panel">' +
              '<div class="page-tools">' +
                '<button type="button" class="mini" data-act="all" data-i="' + i + '"' + (merging ? ' disabled' : '') + '>全选</button>' +
                '<button type="button" class="mini" data-act="none" data-i="' + i + '"' + (merging ? ' disabled' : '') + '>全不选</button>' +
                '<button type="button" class="mini" data-act="invert" data-i="' + i + '"' + (merging ? ' disabled' : '') + '>反选</button>' +
                '<input type="text" class="range-input" data-range="' + i + '" placeholder="如 1-3,5" value="' + escapeHtml(entry.rangeText) + '"' + (merging ? ' disabled' : '') + '>' +
                '<button type="button" class="mini" data-act="range" data-i="' + i + '"' + (merging ? ' disabled' : '') + '>应用范围</button>' +
                '<span class="page-hint' + (entry.rangeError ? ' bad' : '') + '">' +
                  escapeHtml(entry.rangeError || ('已选 ' + selectedCount(entry) + ' / ' + entry.pages + ' 页')) +
                '</span>' +
              '</div>' +
              '<div class="pages">' + chips + '</div>' +
            '</div>';
        } else {
          html += '<div class="page-panel page-hint">' +
            (entry.pages === null
              ? (entry.counting ? '正在读取页数…' : '页数读取失败，将按全部页面合并。')
              : '该文件没有页面。') + '</div>';
        }
      }

      li.innerHTML = html;
      list.appendChild(li);
    });
  }

  function syncButtons() {
    mergeBtn.disabled = merging || counting > 0;
    clearBtn.disabled = merging;
  }

  // ---------- 读取页数 ----------
  function entryById(id) {
    for (var i = 0; i < entries.length; i++) if (String(entries[i].id) === String(id)) return entries[i];
    return null;
  }

  async function readPageCount(entry) {
    if (!entry || entry.pages !== null || entry.counting) return;
    entry.counting = true;
    counting++;
    syncButtons();
    render();
    try {
      var buffer = await entry.file.arrayBuffer();
      var doc = await window.PDFLib.PDFDocument.load(buffer, { updateMetadata: false });
      entry.pages = doc.getPageCount();
      entry.selected = allPages(entry.pages);
      entry.countError = '';
    } catch (e) {
      var message = String((e && e.message) || e);
      entry.pages = null;
      entry.countError = /encrypt/i.test(message) ? '加密 PDF' : '页数读取失败';
    } finally {
      entry.counting = false;
      counting--;
      syncButtons();
      render();
      if (!merging && counting === 0 && entries.length) {
        var failed = entries.filter(function (e) { return e.countError; });
        var pending = entries.some(function (e) {
          return e.pages === null && !e.countError && !e.counting && e.file.size <= AUTO_COUNT_LIMIT;
        });
        if (failed.length) {
          setStatus('有 ' + failed.length + ' 个文件页数读取失败（' + failed[0].countError + '），将按全部页面合并。', 'error');
        } else if (!pending) {
          setStatus('已读取页数，展开文件可勾选要合并的页面（默认全选）。', 'info');
        }
      }
    }
  }

  // 后台串行预读页数：一次只读一个文件，避免多个大文件同时占内存。
  async function countQueue() {
    for (var i = 0; i < entries.length; i++) {
      if (merging) return;
      var entry = entries[i];
      if (entry.pages !== null || entry.counting) continue;
      if (entry.file.size > AUTO_COUNT_LIMIT) continue;
      await readPageCount(entry);
    }
  }

  function addFiles(fileList) {
    if (merging) return;
    var added = 0;
    var skipped = 0;
    Array.prototype.forEach.call(fileList, function (file) {
      if (!/.pdf$/i.test(file.name) && file.type !== 'application/pdf') { skipped++; return; }
      entries.push({
        id: nextId++,
        file: file,
        pages: null,
        selected: null,
        countError: '',
        counting: false,
        expanded: false,
        rangeText: '',
        rangeError: ''
      });
      added++;
    });
    if (added) {
      setStatus('已添加 ' + added + ' 个文件，正在读取页数…', 'info');
      countQueue();
    }
    if (skipped) setStatus('已跳过 ' + skipped + ' 个非 PDF 文件。', 'error');
    result.hidden = true;
    render();
  }

  // ---------- 合并 ----------
  async function mergeLocally(onStep) {
    if (!window.PDFLib || !window.PDFLib.PDFDocument) {
      throw new Error('PDF 引擎加载失败，请刷新页面重试。');
    }
    var out = await window.PDFLib.PDFDocument.create();
    var totalPages = 0;
    var noPageFiles = [];

    for (var i = 0; i < entries.length; i++) {
      var entry = entries[i];
      var file = entry.file;
      await onStep(i, entries.length, file.name);

      var buffer = await file.arrayBuffer();
      if (!buffer.byteLength) throw new Error('「' + file.name + '」是空文件。');

      var src;
      try {
        src = await window.PDFLib.PDFDocument.load(buffer, { updateMetadata: false });
      } catch (e) {
        var message = String((e && e.message) || e);
        if (/encrypt/i.test(message)) {
          throw new Error('「' + file.name + '」是加密 PDF，请先解除密码后再合并。');
        }
        throw new Error('「' + file.name + '」解析失败，可能已损坏或不是真正的 PDF。');
      }

      var total = src.getPageCount();
      var chosen = entry.selected || allPages(total);
      var indices = Array.from(chosen)
        .filter(function (p) { return p >= 1 && p <= total; })
        .sort(function (a, b) { return a - b; })
        .map(function (p) { return p - 1; });

      if (!indices.length) {
        noPageFiles.push(file.name);
        buffer = null;
        src = null;
        continue;
      }
      var pages = await out.copyPages(src, indices);
      for (var p = 0; p < pages.length; p++) out.addPage(pages[p]);
      totalPages += indices.length;
      // 主动断开引用，尽早释放上一份文件占用的内存。
      buffer = null;
      src = null;
    }

    if (!totalPages) throw new Error('没有选中任何页面，请至少选择一个文件的页面。');

    await onStep(entries.length, entries.length, '正在生成合并文件');
    var bytes = await out.save({ useObjectStreams: true });
    return { bytes: bytes, pages: totalPages, emptyFiles: noPageFiles };
  }

  async function requestSaveHandle(defaultName) {
    if (typeof window.showSaveFilePicker !== 'function') return { supported: false, handle: null };
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: defaultName,
        types: [{ description: 'PDF 文件', accept: { 'application/pdf': ['.pdf'] } }]
      });
      return { supported: true, handle: handle };
    } catch (e) {
      if (e && e.name === 'AbortError') return { canceled: true, supported: true, handle: null };
      return { supported: false, handle: null };
    }
  }

  async function writeToHandle(handle, blob) {
    var writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
  }

  // ---------- 交互 ----------
  dropzone.addEventListener('click', function () { if (!merging) input.click(); });
  input.addEventListener('change', function () {
    addFiles(input.files);
    input.value = '';
  });

  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); dragDepth = 0; dropzone.classList.remove('over'); });
  dropzone.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', function (e) { e.preventDefault(); dragDepth--; if (dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('over'); } });
  dropzone.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('over');
    addFiles(e.dataTransfer.files);
  });

  // 记住范围输入框内容，重绘时不会丢；不逐字重绘，避免打断输入。
  list.addEventListener('input', function (e) {
    var rangeInput = e.target.closest('.range-input');
    if (!rangeInput) return;
    var entry = entryById(rangeInput.closest('.file-card').dataset.id);
    if (entry) entry.rangeText = rangeInput.value;
  });

  // 展开后才需要页数：超大文件此时再读一次。
  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;
    var i = Number(btn.getAttribute('data-i'));
    var act = btn.getAttribute('data-act');
    var entry = entries[i];
    if (!entry) return;

    if (act === 'remove') {
      entries.splice(i, 1);
    } else if (act === 'up' && i > 0) {
      var a = entries[i - 1]; entries[i - 1] = entries[i]; entries[i] = a;
    } else if (act === 'down' && i < entries.length - 1) {
      var b = entries[i + 1]; entries[i + 1] = entries[i]; entries[i] = b;
    } else if (act === 'toggle') {
      entry.expanded = !entry.expanded;
      if (entry.expanded && entry.pages === null && !entry.counting) readPageCount(entry);
    } else if (entry.pages) {
      if (!entry.selected) entry.selected = allPages(entry.pages);
      if (act === 'page') {
        var p = Number(btn.getAttribute('data-p'));
        if (entry.selected.has(p)) entry.selected.delete(p); else entry.selected.add(p);
        entry.rangeError = '';
      } else if (act === 'all') {
        entry.selected = allPages(entry.pages);
        entry.rangeError = '';
      } else if (act === 'none') {
        entry.selected = new Set();
        entry.rangeError = '';
      } else if (act === 'invert') {
        var inverted = new Set();
        for (var q = 1; q <= entry.pages; q++) if (!entry.selected.has(q)) inverted.add(q);
        entry.selected = inverted;
        entry.rangeError = '';
      } else if (act === 'range') {
        var parsed = parseRange(entry.rangeText, entry.pages);
        entry.rangeError = parsed.error;
        if (!parsed.error) entry.selected = parsed.pages;
        if (parsed.error) setStatus('第 ' + (i + 1) + ' 个文件的页码：' + parsed.error, 'error');
      }
    }

    result.hidden = true;
    render();
  });

  clearBtn.addEventListener('click', function () {
    if (merging) return;
    entries = [];
    render();
    result.hidden = true;
    setStatus('', 'info');
    setProgress(null);
  });

  mergeBtn.addEventListener('click', async function () {
    if (merging || counting) return;
    if (!entries.length) { setStatus('请先添加 PDF 文件。', 'error'); return; }

    var totalBytes = entries.reduce(function (n, e) { return n + e.file.size; }, 0);
    if (totalBytes > BIG_TOTAL_BYTES) {
      var ok = window.confirm(
        '待合并文件共 ' + fmt(totalBytes) + '，浏览器需要把它们全部读入内存，\n' +
        '大文件可能较慢或因内存不足失败。是否继续？'
      );
      if (!ok) return;
    }

    merging = true;
    syncButtons();
    result.hidden = true;
    setProgress(0);

    var save = await requestSaveHandle('merged-' + timestamp() + '.pdf');
    if (save.canceled) {
      setStatus('已取消保存。', 'info');
      setProgress(null);
      merging = false;
      syncButtons();
      render();
      return;
    }

    setStatus('正在合并，请稍候…', 'info');
    render();
    try {
      var merged = await mergeLocally(async function (done, total, label) {
        setStatus('正在处理 ' + Math.min(done + 1, total) + ' / ' + total + '：' + label, 'info');
        setProgress(total ? done / total : 0);
        // 让出主线程，保证进度能刷新出来。
        await new Promise(function (r) { setTimeout(r, 0); });
      });

      setProgress(1);
      var blob = new Blob([merged.bytes], { type: 'application/pdf' });
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(blob);

      var filename = 'merged-' + timestamp() + '.pdf';
      downloadLink.href = objectUrl;
      downloadLink.download = filename;
      downloadLink.textContent = '再次下载合并后的 PDF（共 ' + merged.pages + ' 页，' + fmt(blob.size) + '）';
      result.hidden = false;

      var tail = merged.emptyFiles.length ? '（已跳过没有选中页的文件：' + merged.emptyFiles.join('、') + '）' : '';

      if (save.handle) {
        try {
          await writeToHandle(save.handle, blob);
          setStatus('已保存到所选位置，共 ' + merged.pages + ' 页，' + fmt(blob.size) + '。' + tail, 'success');
        } catch (writeErr) {
          setStatus('写入所选位置失败：' + (writeErr.message || writeErr) + '，请点击下方链接下载。', 'error');
        }
      } else {
        downloadLink.click();
        setStatus('合并完成，共 ' + merged.pages + ' 页，' + fmt(blob.size) + '，已开始下载。' + tail, 'success');
      }
    } catch (err) {
      setStatus('合并失败：' + (err && err.message ? err.message : err), 'error');
      setProgress(null);
    } finally {
      merging = false;
      syncButtons();
      render();
    }
  });

  window.addEventListener('pagehide', function () { if (objectUrl) URL.revokeObjectURL(objectUrl); });
  render();
})();
</script>
<script src="/gate.js"></script>
<script>
requireAuth().then(function (ok) { if (ok) document.body.classList.remove('auth-gate'); });
</script>
<script src="/user-menu.js"></script>
</body>
