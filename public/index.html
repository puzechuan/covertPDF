<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF合并</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --line: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
    --ok: #059669;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 20px 32px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
  }
  .dropzone {
    border: 2px dashed #c7d2fe;
    border-radius: 14px;
    background: #fafaff;
    padding: 38px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone svg { width: 42px; height: 42px; color: var(--accent); }
  .dropzone strong { display: block; margin-top: 10px; font-size: 16px; }
  .dropzone span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  input[type=file] { display: none; }
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 24px 0 8px; font-size: 13px; color: var(--muted);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  .empty {
    border: 1px dashed var(--line); border-radius: 10px;
    padding: 20px; text-align: center; color: #9ca3af; font-size: 14px;
  }
  .file-card {
    border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 8px; background: #fff; overflow: hidden;
  }
  .file-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; }
  .page-panel { border-top: 1px dashed var(--line); background: #fafaff; padding: 10px 12px 12px; }
  .page-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .mini {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .range-input {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
    font-size: 12px; width: 110px;
  }
  .pages { display: flex; flex-wrap: wrap; gap: 6px; }
  .page-chip {
    min-width: 30px; height: 28px; padding: 0 7px; border: 1px solid var(--line);
    background: #fff; color: var(--muted); border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .page-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .page-hint { font-size: 12px; color: var(--muted); }
  .idx {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-dark);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .size { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 4px; }
  button { font-family: inherit; }
  .icon {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 14px;
    line-height: 1; display: grid; place-items: center;
  }
  .icon:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .icon:disabled { opacity: .35; cursor: not-allowed; }
  .icon.remove:hover { border-color: var(--danger); color: var(--danger); }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line);
  }
  .summary { font-size: 13px; color: var(--muted); }
  .bar-right { display: flex; gap: 10px; align-items: center; }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 9px 16px; border-radius: 9px; cursor: pointer; font-size: 14px;
  }
  .ghost:hover { color: var(--text); border-color: #9ca3af; }
  .primary {
    border: 0; background: var(--accent); color: #fff; font-weight: 600;
    padding: 10px 22px; border-radius: 9px; cursor: pointer; font-size: 14px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, .25);
  }
  .primary:hover:not(:disabled) { background: var(--accent-dark); }
  .primary:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 16px; font-size: 14px; min-height: 22px; }
  .status.info { color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.success { color: var(--ok); }
  .result {
    margin-top: 14px; padding: 16px; border-radius: 10px;
    background: #ecfdf5; border: 1px solid #a7f3d0; font-size: 14px;
  }
  .result a { color: var(--ok); font-weight: 700; text-decoration: none; }
  .result a:hover { text-decoration: underline; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 22px; }
  @media (max-width: 600px) {
    .wrap { padding: 28px 14px; }
    .card { padding: 18px; }
    .bar { flex-direction: column; align-items: stretch; }
    .bar-right { justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PDF合并</h1>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M12 18v-6"></path><path d="m9 15 3-3 3 3"></path>
      </svg>
      <strong>拖拽 PDF 到此处，或点击选择文件</strong>
      <span>可多选，展开文件可勾选要合并的页面（默认全选）</span>
    </div>
    <input type="file" id="fileInput" accept=".pdf,application/pdf" multiple>

    <div class="list-head"><span>文件列表</span><span id="count">0 个文件</span></div>
    <div id="empty" class="empty">还没有添加文件</div>
    <ul id="fileList"></ul>

    <div class="bar">
      <div class="summary" id="summary">总大小 0 B</div>
      <div class="bar-right">
        <button type="button" class="ghost" id="clearBtn">清空</button>
        <button type="button" class="primary" id="mergeBtn">开始合并</button>
      </div>
    </div>

    <div class="status info" id="status"></div>
    <div class="result" id="result" hidden>
      ✓ 合并完成！<a id="downloadLink" href="#" download="merged.pdf">下载合并后的 PDF</a>
    </div>
  </div>

  <footer>默认合并全部页面，可展开文件单独选择 · 单文件最大 40 MB · 总计最大 60 MB · 最多 30 个文件 · 不支持加密 PDF</footer>
</div>

<script>
(function () {
  var input = document.getElementById('fileInput');
  var dropzone = document.getElementById('dropzone');
  var list = document.getElementById('fileList');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var summary = document.getElementById('summary');
  var mergeBtn = document.getElementById('mergeBtn');
  var clearBtn = document.getElementById('clearBtn');
  var statusEl = document.getElementById('status');
  var result = document.getElementById('result');
  var downloadLink = document.getElementById('downloadLink');
  var files = [];
  var objectUrl = null;
  var dragDepth = 0;
  var busy = 0;
  var merging = false;

  function refreshButtons() {
    mergeBtn.disabled = busy > 0 || merging;
  }

  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + (kind || 'info');
  }

  function selectedCount(file) {
    return file.selected ? file.selected.size : (file.pageCount || 0);
  }

  function render() {
    list.innerHTML = '';
    empty.hidden = files.length > 0;
    count.textContent = files.length + ' 个文件';
    var totalPages = files.reduce(function (n, f) { return n + selectedCount(f); }, 0);
    summary.textContent = '总大小 ' + fmt(files.reduce(function (n, f) { return n + f.size; }, 0)) +
      (files.length ? ' · 已选 ' + totalPages + ' 页' : '');

    files.forEach(function (file, i) {
      var li = document.createElement('li');
      li.className = 'file-card';
      var expanded = !!file.expanded;
      var pageInfo = file.pageCount === null ? '页数读取失败（按全部页合并）' :
        (file.pageCount ? '共 ' + file.pageCount + ' 页 · 已选 ' + selectedCount(file) + ' 页' : '正在读取页数…');
      var html =
        '<div class="file-item">' +
          '<span class="idx">' + (i + 1) + '</span>' +
          '<div class="meta"><div class="name" title="' + escapeHtml(file.name) + '">' + escapeHtml(file.name) + '</div>' +
          '<div class="size">' + fmt(file.size) + ' · ' + pageInfo + '</div></div>' +
          '<div class="actions">' +
            '<button type="button" class="icon" data-act="toggle" data-i="' + i + '" title="选择页面">' + (expanded ? '▾' : '▸') + '</button>' +
            '<button type="button" class="icon" data-act="up" data-i="' + i + '" title="上移"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
            '<button type="button" class="icon" data-act="down" data-i="' + i + '" title="下移"' + (i === files.length - 1 ? ' disabled' : '') + '>↓</button>' +
            '<button type="button" class="icon remove" data-act="remove" data-i="' + i + '" title="移除">×</button>' +
          '</div>' +
        '</div>';

      if (expanded) {
        if (file.pageCount) {
          var chips = '';
          for (var p = 1; p <= file.pageCount; p++) {
            chips += '<button type="button" class="page-chip' + ((file.selected && file.selected.has(p)) ? ' on' : '') +
              '" data-act="page" data-i="' + i + '" data-p="' + p + '">' + p + '</button>';
          }
          html +=
            '<div class="page-panel">' +
              '<div class="page-tools">' +
                '<button type="button" class="mini" data-act="all" data-i="' + i + '">全选</button>' +
                '<button type="button" class="mini" data-act="none" data-i="' + i + '">全不选</button>' +
                '<button type="button" class="mini" data-act="invert" data-i="' + i + '">反选</button>' +
                '<input type="text" class="range-input" data-range="' + i + '" placeholder="如 1-3,5">' +
                '<button type="button" class="mini" data-act="range" data-i="' + i + '">应用范围</button>' +
                '<span class="page-hint">页码从 1 开始</span>' +
              '</div>' +
              '<div class="pages">' + chips + '</div>' +
            '</div>';
        } else {
          html += '<div class="page-panel page-hint">' +
            (file.pageCount === null ? '页数读取失败，将按全部页面合并。' : '正在读取页数…') + '</div>';
        }
      }
      li.innerHTML = html;
      list.appendChild(li);
    });
  }

  function addFiles(fileList) {
    var added = 0;
    var skipped = 0;
    var fresh = [];
    Array.prototype.forEach.call(fileList, function (file) {
      if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { skipped++; return; }
      file.expanded = false;
      file.pageCount = undefined;
      file.selected = null;
      files.push(file);
      fresh.push(file);
      added++;
    });
    if (added) {
      setStatus('已添加 ' + added + ' 个文件，正在读取页数…', 'info');
      inspectFiles(fresh);
    }
    if (skipped) setStatus('已跳过 ' + skipped + ' 个非 PDF 文件。', 'error');
    result.hidden = true;
    render();
  }

  async function inspectFiles(newFiles) {
    if (!newFiles.length) return;
    busy++;
    refreshButtons();
    var fd = new FormData();
    newFiles.forEach(function (f) { fd.append('files', f, f.name); });
    try {
      var res = await fetch('/inspect', { method: 'POST', body: fd });
      var data = {};
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error(data.error || ('读取页数失败（HTTP ' + res.status + '）'));
      (data.files || []).forEach(function (info, i) {
        var f = newFiles[i];
        if (!f) return;
        f.pageCount = info.pages;
        f.selected = new Set();
        for (var p = 1; p <= info.pages; p++) f.selected.add(p);
      });
      setStatus('已读取页数，展开文件可勾选要合并的页面（默认全选）。', 'info');
    } catch (err) {
      newFiles.forEach(function (f) { f.pageCount = null; f.selected = null; });
      setStatus('页数读取失败：' + err.message + '（将按全部页面合并）', 'error');
    } finally {
      busy--;
      refreshButtons();
      render();
    }
  }

  dropzone.addEventListener('click', function () { input.click(); });
  input.addEventListener('change', function () {
    addFiles(input.files);
    input.value = '';
  });

  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); dragDepth = 0; dropzone.classList.remove('over'); });
  dropzone.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', function (e) { e.preventDefault(); dragDepth--; if (dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('over'); } });
  dropzone.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('over');
    addFiles(e.dataTransfer.files);
  });

  function parseRange(text, count) {
    var out = new Set();
    if (!text || !text.trim()) return out;
    text.split(',').forEach(function (part) {
      var m = /^\s*(\d+)\s*(?:-\s*(\d+)\s*)?$/.exec(part);
      if (!m) return;
      var a = parseInt(m[1], 10);
      var b = m[2] ? parseInt(m[2], 10) : a;
      if (b < a) { var t = a; a = b; b = t; }
      for (var p = Math.max(1, a); p <= Math.min(count, b); p++) out.add(p);
    });
    return out;
  }

  list.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;
    var i = Number(btn.getAttribute('data-i'));
    var act = btn.getAttribute('data-act');
    var file = files[i];
    if (!file) return;

    if (act === 'remove') { files.splice(i, 1); }
    else if (act === 'up' && i > 0) { var a = files[i - 1]; files[i - 1] = files[i]; files[i] = a; }
    else if (act === 'down' && i < files.length - 1) { var b = files[i + 1]; files[i + 1] = files[i]; files[i] = b; }
    else if (act === 'toggle') { file.expanded = !file.expanded; }
    else if (file.selected && file.pageCount) {
      var p;
      if (act === 'page') {
        p = Number(btn.getAttribute('data-p'));
        if (file.selected.has(p)) file.selected.delete(p); else file.selected.add(p);
      } else if (act === 'all') {
        for (p = 1; p <= file.pageCount; p++) file.selected.add(p);
      } else if (act === 'none') {
        file.selected.clear();
      } else if (act === 'invert') {
        var inverted = new Set();
        for (p = 1; p <= file.pageCount; p++) if (!file.selected.has(p)) inverted.add(p);
        file.selected = inverted;
      } else if (act === 'range') {
        var inputEl = list.querySelector('[data-range="' + i + '"]');
        file.selected = parseRange(inputEl ? inputEl.value : '', file.pageCount);
      }
    }
    result.hidden = true;
    render();
  });

  clearBtn.addEventListener('click', function () {
    files = [];
    render();
    result.hidden = true;
    setStatus('', 'info');
  });

  mergeBtn.addEventListener('click', async function () {
    if (!files.length) { setStatus('请先添加 PDF 文件。', 'error'); return; }
    if (busy > 0 || merging) return;
    merging = true;
    refreshButtons();
    result.hidden = true;
    setStatus('正在上传并合并，请稍候…', 'info');
    var fd = new FormData();
    files.forEach(function (f) { fd.append('files', f, f.name); });
    var selection = files.map(function (f) {
      if (!f.selected) return null;
      return Array.from(f.selected).map(function (p) { return p - 1; }).sort(function (a, b) { return a - b; });
    });
    fd.append('selection', JSON.stringify(selection));
    try {
      var res = await fetch('/merge', { method: 'POST', body: fd });
      if (!res.ok) {
        var data = {};
        try { data = await res.json(); } catch (e) {}
        throw new Error(data.error || ('请求失败（HTTP ' + res.status + '）'));
      }
      var blob = await res.blob();
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(blob);
      var pages = res.headers.get('X-Merged-Pages');
      var cd = res.headers.get('Content-Disposition') || '';
      var m = /filename="([^"]+)"/.exec(cd);
      downloadLink.href = objectUrl;
      downloadLink.download = m ? m[1] : 'merged.pdf';
      downloadLink.textContent = '下载合并后的 PDF' + (pages ? '（共 ' + pages + ' 页，' + fmt(blob.size) + '）' : '');
      result.hidden = false;
      setStatus('合并完成！', 'success');
      downloadLink.click();
    } catch (err) {
      setStatus('合并失败：' + err.message, 'error');
    } finally {
      merging = false;
      refreshButtons();
    }
  });

  window.addEventListener('unload', function () { if (objectUrl) URL.revokeObjectURL(objectUrl); });
  render();
})();
</script>
</body>
</html>
