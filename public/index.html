<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 工具箱</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --line: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --accent-soft: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 64px 20px 32px; }
  header { text-align: center; margin-bottom: 40px; }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-dark);
    font-size: 12px; font-weight: 700; margin-bottom: 14px;
  }
  h1 { font-size: 34px; margin: 0 0 8px; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .tool {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
    display: flex; flex-direction: column; gap: 12px;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .tool:hover { transform: translateY(-3px); border-color: #c7d2fe; box-shadow: 0 14px 34px rgba(79, 70, 229, .12); }
  .tool-icon {
    width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft);
    color: var(--accent); display: grid; place-items: center;
  }
  .tool-icon svg { width: 26px; height: 26px; }
  .tool h2 { font-size: 20px; margin: 2px 0 0; }
  .tool p { margin: 0; color: var(--muted); font-size: 14px; }
  .tool ul { margin: 4px 0 8px; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .tool li + li { margin-top: 4px; }
  .btn {
    align-self: flex-start; margin-top: auto; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    padding: 10px 20px; border-radius: 9px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, .25);
  }
  .btn:hover { background: var(--accent-dark); }
  .note {
    margin-top: 28px; text-align: center; color: #9ca3af; font-size: 12px;
  }
  @media (max-width: 700px) {
    .wrap { padding: 40px 14px 28px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
<style>body.auth-gate { visibility: hidden; }</style>
</head>
<body class="auth-gate">
<div class="wrap">
  <header>
    <h1>PDF工具箱</h1>
    <p>合并与编辑 PDF，打开文件即可开始</p>
  </header>

  <div class="grid">
    <section class="tool">
      <div class="tool-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"></path>
          <path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"></path>
          <path d="M12 7v10"></path><path d="m8 12 4-4 4 4"></path>
        </svg>
      </div>
      <h2>PDF 合并</h2>
      <p>把多个 PDF 按顺序拼接成一个文件。</p>
      <ul>
        <li>拖拽多选、自由调整顺序</li>
        <li>服务端合并，支持中文文件名</li>
      </ul>
      <a class="btn" href="/merge-pdf">开始合并 →</a>
    </section>

    <section class="tool">
      <div class="tool-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path>
        </svg>
      </div>
      <h2>PDF 编辑</h2>
      <p>在页面上添加文字、高亮、画笔和框选标注。</p>
      <ul>
        <li>逐字/词替换 PDF 原有文字</li>
        <li>添加中文文字、高亮、自由画笔、矩形</li>
        <li>橡皮擦、撤销、缩放、删除页面</li>
        <li>浏览器内完成导出，文件不上传</li>
      </ul>
      <a class="btn" href="/edit-pdf">开始编辑 →</a>
    </section>
  </div>

  <div class="note">编辑与合并均不保存文件；关闭页面后内容不会保留</div>
</div>
<script src="/gate.js"></script>
<script>
requireAuth().then(function (ok) { if (ok) document.body.classList.remove('auth-gate'); });
</script>
</body>
</html>
