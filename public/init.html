<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初始化管理员 - PDF 工具箱</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root { --bg:#f5f6fa; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280; --accent:#4f46e5; --danger:#dc2626; --ok:#059669; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; line-height:1.6; }
  .wrap { max-width:460px; margin:0 auto; padding:48px 18px 30px; }
  header { text-align:center; margin-bottom:22px; }
  h1 { font-size:26px; margin:0 0 4px; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px; box-shadow:0 10px 30px rgba(17,24,39,.05); }
  .notice { background:#eef2ff; border:1px solid #c7d2fe; color:#3730a3; border-radius:10px; padding:12px 14px; font-size:13px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input[type=email], input[type=text] { width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-family:inherit; font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 2px #eef2ff; }
  .code-row { display:flex; gap:8px; }
  .code-row input { flex:1; }
  button { font-family:inherit; }
  .btn { border:0; background:var(--accent); color:#fff; font-weight:600; padding:10px 14px; border-radius:9px; cursor:pointer; font-size:14px; white-space:nowrap; }
  .btn:hover:not(:disabled) { background:#4338ca; }
  .btn:disabled { opacity:.55; cursor:wait; }
  .btn.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  .btn.block { width:100%; margin-top:20px; padding:11px; }
  .status { margin-top:14px; min-height:22px; font-size:13px; color:var(--muted); }
  .status.error { color:var(--danger); }
  .status.success { color:var(--ok); }
  .devcode { margin-top:8px; padding:8px 10px; border-radius:8px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; font-size:13px; word-break:break-all; }
  a.btn { display:inline-block; text-decoration:none; text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>PDF 工具箱</h1><a href="/">← 返回首页</a></header>
  <div class="card">
    <div id="initView">
      <div class="notice"><strong>仅首次使用：</strong>在这里注册的账号会成为管理员，之后其他页面注册的均为普通用户。管理员账号只能初始化一次。</div>
      <label for="email">管理员邮箱</label>
      <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
      <label for="code">验证码</label>
      <div class="code-row">
        <input type="text" id="code" placeholder="邮件中的验证码" autocomplete="one-time-code">
        <button type="button" class="btn ghost" id="sendBtn">获取验证码</button>
      </div>
      <button type="button" class="btn block" id="submitBtn">完成初始化</button>
      <div class="status" id="status"></div>
      <div class="devcode" id="devCode" hidden></div>
    </div>
    <div id="doneView" hidden style="text-align:center;padding:12px 0">
      <h2 style="font-size:18px;margin:0 0 8px">管理员已初始化</h2>
      <p style="color:var(--muted);font-size:13px">无需再次初始化。请使用已注册账号登录。</p>
      <a class="btn ghost" href="/login" style="margin-top:14px">前往登录</a>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var initView = document.getElementById('initView');
  var doneView = document.getElementById('doneView');
  var emailEl = document.getElementById('email');
  var codeEl = document.getElementById('code');
  var sendBtn = document.getElementById('sendBtn');
  var submitBtn = document.getElementById('submitBtn');
  var statusEl = document.getElementById('status');
  var devCodeEl = document.getElementById('devCode');

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function api(path, options) {
    var res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {}));
    var data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || ('请求失败（HTTP ' + res.status + '）'));
    return data;
  }

  async function load() {
    try {
      var settings = await api('/auth/settings');
      if (settings.initialized) {
        initView.hidden = true;
        doneView.hidden = false;
      }
    } catch (e) { setStatus(e.message, 'error'); }
  }

  sendBtn.addEventListener('click', async function () {
    var email = emailEl.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setStatus('请输入有效的邮箱地址。', 'error'); return; }
    sendBtn.disabled = true;
    setStatus('正在发送验证码…');
    try {
      var res = await api('/auth/send-code', {
        method: 'POST',
        body: JSON.stringify({ email: email, purpose: 'init' })
      });
      if (res.devCode) {
        devCodeEl.hidden = false;
        devCodeEl.textContent = '开发模式验证码：' + res.devCode + '（未配置邮件服务时仅在本地返回）';
      }
      setStatus('验证码已发送到该邮箱，请查收。', 'success');
    } catch (e) { setStatus('发送失败：' + e.message, 'error'); }
    sendBtn.disabled = false;
  });

  submitBtn.addEventListener('click', async function () {
    var email = emailEl.value.trim();
    var code = codeEl.value.trim();
    if (!email || !code) { setStatus('请填写邮箱和验证码。', 'error'); return; }
    submitBtn.disabled = true;
    setStatus('正在验证并创建管理员…');
    try {
      await api('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ email: email, code: code, isInit: true })
      });
      window.location.href = '/admin';
    } catch (e) {
      setStatus('初始化失败：' + e.message, 'error');
      submitBtn.disabled = false;
    }
  });

  load();
})();
</script>
</body>
</html>
