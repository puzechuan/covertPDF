<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word转PDF</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --line: #e5e7eb;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --accent-soft: #eef2ff;
    --danger: #dc2626;
    --ok: #059669;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 48px 20px 32px; }
  header { text-align: center; margin-bottom: 28px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.5px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.05);
  }
  .dropzone {
    border: 2px dashed #c7d2fe;
    border-radius: 14px;
    background: #fafaff;
    padding: 38px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.over { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone.busy { cursor: progress; opacity: .6; }
  .dropzone svg { width: 42px; height: 42px; color: var(--accent); }
  .dropzone strong { display: block; margin-top: 10px; font-size: 16px; }
  .dropzone span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  input[type=file] { display: none; }
  .file-card {
    display: flex; align-items: center; gap: 12px;
    margin-top: 18px; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
  }
  .file-card[hidden] { display: none; }
  .idx {
    flex: 0 0 34px; height: 34px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent-dark);
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }
  .meta { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .size { font-size: 12px; color: var(--muted); }
  .icon {
    flex: 0 0 30px;
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 14px;
    line-height: 1; display: grid; place-items: center; font-family: inherit;
  }
  .icon:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .icon:disabled { opacity: .35; cursor: not-allowed; }
  .options {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-top: 16px; font-size: 13px; color: var(--muted);
  }
  .options select {
    font-family: inherit; font-size: 13px; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: #fff;
  }
  .options select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 70, 229, .12); }
  .options .hint { font-size: 12px; color: #9ca3af; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line);
  }
  .summary { font-size: 13px; color: var(--muted); }
  .bar-right { display: flex; gap: 10px; align-items: center; }
  button { font-family: inherit; }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    padding: 9px 16px; border-radius: 9px; cursor: pointer; font-size: 14px;
  }
  .ghost:hover:not(:disabled) { color: var(--text); border-color: #9ca3af; }
  .ghost:disabled { opacity: .5; cursor: not-allowed; }
  .primary {
    border: 0; background: var(--accent); color: #fff; font-weight: 600;
    padding: 10px 22px; border-radius: 9px; cursor: pointer; font-size: 14px;
    box-shadow: 0 4px 12px rgba(79, 70, 229, .25);
  }
  .primary:hover:not(:disabled) { background: var(--accent-dark); }
  .primary:disabled { opacity: .6; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 14px; min-height: 22px; }
  .status.info { color: var(--muted); }
  .status.error { color: var(--danger); }
  .status.success { color: var(--ok); }
  .progress {
    height: 4px; border-radius: 999px; background: #eef2ff;
    overflow: hidden; margin-top: 10px; display: none;
  }
  .progress.on { display: block; }
  .progress i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #6366f1, #4f46e5);
    transition: width .2s ease;
  }
  .result {
    margin-top: 14px; padding: 16px; border-radius: 10px;
    background: #ecfdf5; border: 1px solid #a7f3d0; font-size: 14px;
  }
  .result a { color: var(--ok); font-weight: 700; text-decoration: none; }
  .result a:hover { text-decoration: underline; }
  footer { text-align: center; color: #9ca3af; font-size: 12px; margin-top: 22px; line-height: 1.8; }
  @media (max-width: 600px) {
    .wrap { padding: 28px 14px; }
    .card { padding: 18px; }
    .bar { flex-direction: column; align-items: stretch; }
    .bar-right { justify-content: flex-end; }
  }

  /* 离屏渲染区：docx-preview 把文档渲染到这里，再交给 html2canvas 截图 */
  #docxHost {
    position: absolute;
    left: -20000px;
    top: 0;
    width: 1200px;
    background: #fff;
    z-index: -1;
    pointer-events: none;
  }
  #docxHost .docx-wrapper { background: #fff; padding: 0; display: block; }
  #docxHost .docx-wrapper > section.docx { box-shadow: none; margin: 0 0 24px; }
</style>
<style>body.auth-gate { visibility: hidden; }</style>
</head>
<body class="auth-gate">
<div class="wrap">
  <header>
    <h1>Word 转 PDF</h1>
    <p><a href="/" style="color:var(--accent);text-decoration:none">← 返回 PDF 工具箱</a></p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <path d="M14 2v6h6"></path>
        <path d="M8.5 12.5 10 18l2-4 2 4 1.5-5.5"></path>
      </svg>
      <strong>拖拽 Word 文档到此处，或点击选择文件</strong>
      <span>支持 .docx（Word 2007+ / WPS 导出的格式）；旧版 .doc 请先另存为 .docx</span>
    </div>
    <input type="file" id="fileInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">

    <div class="file-card" id="fileCard" hidden>
      <span class="idx">W</span>
      <div class="meta">
        <div class="name" id="fileName"></div>
        <div class="size" id="fileMeta"></div>
      </div>
      <button type="button" class="icon" id="removeBtn" title="移除">×</button>
    </div>

    <div class="options">
      <label for="quality">输出质量</label>
      <select id="quality">
        <option value="1.5">标准（约 144 DPI，文件最小）</option>
        <option value="2" selected>高清（约 192 DPI）</option>
        <option value="3">超清（约 288 DPI，文件较大）</option>
      </select>
      <span class="hint">页面按图片写入 PDF，版式与 Word 一致</span>
    </div>

    <div class="bar">
      <div class="summary" id="summary">还没有选择文件</div>
      <div class="bar-right">
        <button type="button" class="ghost" id="clearBtn">清空</button>
        <button type="button" class="primary" id="convertBtn">开始转换</button>
      </div>
    </div>

    <div class="status info" id="status"></div>
    <div class="progress" id="progress"><i id="progressBar"></i></div>
    <div class="result" id="result" hidden>
      ✓ 转换完成！<a id="downloadLink" href="#" download="converted.pdf">下载转换后的 PDF</a>
    </div>
  </div>

  <footer>
    文件只在浏览器本地处理，不会上传 · 转换后的页面以图片形式写入 PDF，文字不可再复制<br>
    支持正文、表格、图片、页眉页脚；非常复杂的分栏 / 竖排排版可能有细微差异
  </footer>
</div>

<div id="docxHost" aria-hidden="true"></div>

<script src="/vendor/jszip.min.js"></script>
<script src="/vendor/docx-preview.min.js"></script>
<script src="/vendor/html2canvas.min.js"></script>
<script src="/vendor/pdf-lib.min.js"></script>
<script>
(function () {
  'use strict';

  // 96 CSS px = 1 英寸 = 72pt，用于把页面像素尺寸换算成 PDF 点尺寸。
  var PT_PER_PX = 0.75;
  var MAX_FILE_BYTES = 60 * 1024 * 1024;
  var CHUNK_PAGES = 3;        // 一次 html2canvas 最多栅格化 3 页，避免超大画布
  var MIN_SLICE_PX = 80;      // 分页时允许向上收缩的最大幅度
  var BODY_SAFE_GAP = 10;     // 正文区底部与页脚之间预留的空隙（px）

  var DOCX_OPTIONS = {
    className: 'docx',
    inWrapper: true,
    breakPages: true,
    ignoreLastRenderedPageBreak: false, // 尽量沿用 Word 保存时的分页位置
    experimental: true,
    useBase64URL: true,                 // 图片转 data URL，截图更稳
    renderHeaders: true,
    renderFooters: true,
    renderFootnotes: true,
    renderEndnotes: true,
    renderComments: false,
    ignoreWidth: false,
    ignoreHeight: false,
    ignoreFonts: false
  };

  var input = document.getElementById('fileInput');
  var dropzone = document.getElementById('dropzone');
  var fileCard = document.getElementById('fileCard');
  var fileName = document.getElementById('fileName');
  var fileMeta = document.getElementById('fileMeta');
  var removeBtn = document.getElementById('removeBtn');
  var qualitySel = document.getElementById('quality');
  var convertBtn = document.getElementById('convertBtn');
  var clearBtn = document.getElementById('clearBtn');
  var summary = document.getElementById('summary');
  var statusEl = document.getElementById('status');
  var progressEl = document.getElementById('progress');
  var progressBar = document.getElementById('progressBar');
  var result = document.getElementById('result');
  var downloadLink = document.getElementById('downloadLink');
  var host = document.getElementById('docxHost');

  var state = { file: null, busy: false, objectUrl: null };
  var dragDepth = 0;

  // ---------- 小工具 ----------
  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function timestamp() {
    var d = new Date();
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function baseName(name) {
    return String(name || 'document').replace(/\.[^.\\/]+$/, '');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function tick() {
    return new Promise(function (r) { setTimeout(r, 0); });
  }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    statusEl.className = 'status ' + (kind || 'info');
  }

  function setProgress(ratio) {
    if (ratio === null) {
      progressEl.classList.remove('on');
      progressBar.style.width = '0%';
      return;
    }
    progressEl.classList.add('on');
    progressBar.style.width = Math.max(0, Math.min(1, ratio)) * 100 + '%';
  }

  function syncUI() {
    var has = !!state.file;
    convertBtn.disabled = !has || state.busy;
    clearBtn.disabled = !has || state.busy;
    removeBtn.disabled = state.busy;
    qualitySel.disabled = state.busy;
    dropzone.classList.toggle('busy', state.busy);
  }

  function renderFile() {
    if (!state.file) {
      fileCard.hidden = true;
      summary.textContent = '还没有选择文件';
      syncUI();
      return;
    }
    fileName.textContent = state.file.name;
    fileName.title = state.file.name;
    fileMeta.textContent = fmt(state.file.size) + ' · ' + (state.busy ? '转换中…' : '准备就绪');
    fileCard.hidden = false;
    summary.textContent = fmt(state.file.size) + (state.busy ? ' · 转换中' : '');
    syncUI();
  }

  // ---------- 选择文件 ----------
  async function headBytes(file, count) {
    return new Uint8Array(await file.slice(0, count).arrayBuffer());
  }

  async function acceptFile(file) {
    if (!file || state.busy) return;
    result.hidden = true;
    setProgress(null);

    if (/\.doc$/i.test(file.name)) {
      setStatus('旧版 .doc 格式暂不支持，请用 Word / WPS 打开后「另存为」.docx 再试。', 'error');
      return;
    }
    if (!/\.docx$/i.test(file.name)) {
      setStatus('请选择 .docx 格式的 Word 文档。', 'error');
      return;
    }
    if (file.size > MAX_FILE_BYTES) {
      setStatus('文件 ' + fmt(file.size) + '，超过 ' + fmt(MAX_FILE_BYTES) + ' 的限制。', 'error');
      return;
    }
    if (!file.size) {
      setStatus('这个文件是空的。', 'error');
      return;
    }

    var head = await headBytes(file, 8);
    if (head[0] === 0xd0 && head[1] === 0xcf) {
      setStatus('这个文件不是 .docx（可能是旧版 .doc，或加了打开密码）。请另存为不带密码的 .docx。', 'error');
      return;
    }
    if (!(head[0] === 0x50 && head[1] === 0x4b)) {
      setStatus('文件内容不是有效的 .docx（不是标准压缩包结构）。', 'error');
      return;
    }

    state.file = file;
    renderFile();
    setStatus('已选择「' + file.name + '」，点「开始转换」生成 PDF。', 'info');
  }

  // ---------- 另存为 ----------
  async function requestSaveHandle(defaultName) {
    if (typeof window.showSaveFilePicker !== 'function') return { handle: null };
    try {
      var handle = await window.showSaveFilePicker({
        suggestedName: defaultName,
        types: [{ description: 'PDF 文件', accept: { 'application/pdf': ['.pdf'] } }]
      });
      return { handle: handle };
    } catch (e) {
      if (e && e.name === 'AbortError') return { canceled: true, handle: null };
      return { handle: null };
    }
  }

  async function writeToHandle(handle, blob) {
    var writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise(function (resolve, reject) {
      if (typeof canvas.toBlob === 'function') {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error('生成页面图片失败，可能是文档过大。'));
        }, type, quality);
        return;
      }
      try {
        var data = canvas.toDataURL(type, quality).split(',')[1];
        var binary = atob(data);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        resolve(new Blob([bytes], { type: type }));
      } catch (e) {
        reject(e);
      }
    });
  }

  async function waitForImages(root) {
    var imgs = Array.prototype.slice.call(root.querySelectorAll('img'));
    await Promise.all(imgs.map(function (img) {
      if (img.complete) return null;
      return new Promise(function (resolve) {
        var done = false;
        var finish = function () { if (!done) { done = true; resolve(); } };
        img.addEventListener('load', finish, { once: true });
        img.addEventListener('error', finish, { once: true });
        setTimeout(finish, 3000);
      });
    }));
  }

  // ---------- 版面测量与分页 ----------

  // 收集所有文字行、图片、表格行的矩形（相对 section 顶部），用于避免从行中间切断。
  // para 记录所属元素，便于判断「孤行」。
  function collectBlocks(sec) {
    var secTop = sec.getBoundingClientRect().top;
    var blocks = [];
    var walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, null);
    var range = document.createRange();
    var node;
    while ((node = walker.nextNode())) {
      if (!node.nodeValue || !/\S/.test(node.nodeValue)) continue;
      var parent = node.parentNode;
      if (parent && parent.closest && parent.closest('header,footer')) continue;
      range.selectNodeContents(node);
      var rects = range.getClientRects();
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (r.height < 1 || r.width < 1) continue;
        blocks.push({ top: r.top - secTop, bottom: r.bottom - secTop, para: parent });
      }
    }
    var others = sec.querySelectorAll('img,svg,video,canvas,tr');
    for (var j = 0; j < others.length; j++) {
      if (others[j].closest && others[j].closest('header,footer')) continue;
      var er = others[j].getBoundingClientRect();
      if (er.height < 1) continue;
      blocks.push({ top: er.top - secTop, bottom: er.bottom - secTop, para: others[j] });
    }
    return blocks;
  }

  // 在 target 附近找一个不会横切文字行的位置。
  function safeCut(blocks, target, lower, upper) {
    var y = target;
    for (var guard = 0; guard < 40; guard++) {
      var hit = null;
      for (var i = 0; i < blocks.length; i++) {
        var b = blocks[i];
        if (b.top < y - 0.5 && b.bottom > y + 0.5) { hit = b; break; }
      }
      if (!hit) return y;
      if (hit.top >= lower && hit.top < y) { y = hit.top; continue; }
      if (hit.bottom <= upper && hit.bottom > y) { y = hit.bottom; continue; }
      return Math.min(upper, Math.max(lower, target));
    }
    return y;
  }

  // 孤行控制：不把段落的首行单独留在页尾，也不把末行单独挤到下一页。
  function avoidOrphanLine(blocks, cut, start) {
    var lastAbove = null, firstBelow = null;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      if (b.bottom <= cut + 1 && (!lastAbove || b.bottom > lastAbove.bottom)) lastAbove = b;
      if (b.top >= cut - 1 && (!firstBelow || b.top < firstBelow.top)) firstBelow = b;
    }
    if (!lastAbove || !firstBelow || lastAbove.para !== firstBelow.para) return cut;

    var lines = [];
    for (var j = 0; j < blocks.length; j++) {
      if (blocks[j].para === firstBelow.para) lines.push(blocks[j]);
    }
    if (lines.length < 2) return cut;
    lines.sort(function (a, b) { return a.top - b.top; });

    var above = 0;
    for (var k = 0; k < lines.length; k++) if (lines[k].bottom <= cut + 1) above++;
    var below = lines.length - above;
    var newCut = cut;
    if (above === 1) newCut = lines[0].top;                       // 首行孤悬：整段下移
    else if (below === 1) newCut = lines[lines.length - 2].top;   // 末行孤悬：多带一行下去

    if (!(newCut < cut)) return cut;
    if (newCut <= start + MIN_SLICE_PX) return cut;
    if (cut - newCut > 120) return cut;                           // 只做一两行的微调
    return newCut;
  }

  function planSection(sec) {
    var rect = sec.getBoundingClientRect();
    var cs = getComputedStyle(sec);
    var padTop = parseFloat(cs.paddingTop) || 0;
    var padBottom = parseFloat(cs.paddingBottom) || 0;
    var pageW = rect.width > 0 ? rect.width : 794;
    var pageH = parseFloat(cs.minHeight);
    // 正常情况 docx-preview 会按 sectPr 写入 min-height；读不到就按 A4 估算
    if (!(pageH > 100)) pageH = 1123;

    // docx-preview 的 section 带 overflow:hidden，先放开，保证内容不被裁掉
    sec.style.overflow = 'visible';

    var article = null, headerEl = null, footerEl = null;
    Array.prototype.forEach.call(sec.children, function (child) {
      var tag = child.tagName;
      if (tag === 'ARTICLE') article = child;
      else if (tag === 'HEADER') headerEl = child;
      else if (tag === 'FOOTER') footerEl = child;
    });

    var bodyTop = padTop;
    if (article) {
      var ar = article.getBoundingClientRect();
      if (ar.height > 0 && ar.top - rect.top >= 0) bodyTop = ar.top - rect.top;
    }

    // 正文区高度：页面高度减去上下的页边距，再留一点余量，
    // 避免最后一行正好压在页脚上（页脚盒子底部对齐页边距，文字会略微上浮）。
    var bodyH = pageH - bodyTop - padBottom - BODY_SAFE_GAP;
    if (!(bodyH > 100)) bodyH = Math.max(120, pageH - bodyTop);

    var blocks = collectBlocks(sec);
    var contentBottom = bodyTop;
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].bottom > contentBottom) contentBottom = blocks[i].bottom;
    }
    if (!(contentBottom > bodyTop + 1)) contentBottom = bodyTop + 1;

    var ranges = [];
    var start = bodyTop;
    var guard = 0;
    while (start < contentBottom - 1 && guard++ < 5000) {
      var target = start + bodyH;
      var cut;
      if (target >= contentBottom) {
        cut = contentBottom;
      } else {
        cut = safeCut(blocks, target, start + MIN_SLICE_PX, contentBottom);
        if (cut < contentBottom) cut = avoidOrphanLine(blocks, cut, start);
      }
      if (!(cut > start + 1)) cut = Math.min(contentBottom, start + bodyH);
      ranges.push({ top: start, bottom: cut });
      start = cut;
    }
    if (!ranges.length) ranges.push({ top: bodyTop, bottom: Math.min(contentBottom, bodyTop + 20) });

    var header = null;
    if (headerEl) {
      var hr = headerEl.getBoundingClientRect();
      if (hr.height > 1 && hr.width > 1) {
        header = { left: hr.left - rect.left, top: hr.top - rect.top, width: hr.width, height: hr.height };
      }
    }
    var footer = null;
    if (footerEl) {
      var fr = footerEl.getBoundingClientRect();
      if (fr.height > 1 && fr.width > 1) {
        var mb = parseFloat(getComputedStyle(footerEl).marginBottom);
        if (!isFinite(mb)) mb = 0;
        footer = {
          left: fr.left - rect.left,
          width: fr.width,
          height: fr.height,
          bottomFromBottom: Math.max(0, padBottom + mb)
        };
      }
    }

    return {
      pageW: pageW,
      pageH: pageH,
      bodyTop: bodyTop,
      bodyH: bodyH,
      ranges: ranges,
      headerEl: header ? headerEl : null,
      footerEl: footer ? footerEl : null,
      header: header,
      footer: footer
    };
  }

  // ---------- 截图 ----------
  // 把 section 的一段搬到离屏裁切框里截图，只渲染这一段的像素。
  async function captureRegion(sec, pageW, top, height, scale) {
    var clip = document.createElement('div');
    clip.style.cssText = 'position:absolute;left:-20000px;top:0;width:' + pageW + 'px;height:' + height +
      'px;overflow:hidden;background:#ffffff;';
    var parent = sec.parentNode;
    var next = sec.nextSibling;
    clip.appendChild(sec);
    document.body.appendChild(clip);
    sec.style.position = 'relative';
    sec.style.top = (-top) + 'px';
    try {
      return await window.html2canvas(clip, {
        scale: scale,
        backgroundColor: '#ffffff',
        logging: false,
        useCORS: true,
        windowWidth: Math.max(Math.ceil(pageW) + 80, 1024),
        windowHeight: Math.max(Math.ceil(height) + 80, 768)
      });
    } finally {
      sec.style.top = '';
      sec.style.position = '';
      if (next && next.parentNode === parent) parent.insertBefore(sec, next);
      else parent.appendChild(sec);
      if (clip.parentNode) clip.parentNode.removeChild(clip);
    }
  }

  async function captureElement(el, scale) {
    if (!el) return null;
    var rect = el.getBoundingClientRect();
    if (!(rect.width > 1) || !(rect.height > 1)) return null;
    var canvas = await window.html2canvas(el, {
      scale: scale,
      backgroundColor: null,
      logging: false,
      useCORS: true
    });
    var blob = await canvasToBlob(canvas, 'image/png');
    var bytes = new Uint8Array(await blob.arrayBuffer());
    canvas.width = 0;
    canvas.height = 0;
    return { bytes: bytes, width: rect.width, height: rect.height };
  }

  async function embedHeaderFooter(pdf, el, scale, cache) {
    if (!el) return null;
    // 多节文档的页眉页脚通常完全一致，按内容做一次缓存，避免重复截图与重复嵌入
    var key = el.innerHTML + '|' + el.className;
    if (cache && cache.has(key)) return cache.get(key);

    var shot = await captureElement(el, scale);
    if (!shot) return null;
    var mark = {
      image: await pdf.embedPng(shot.bytes),
      width: shot.width,
      height: shot.height
    };
    if (cache) cache.set(key, mark);
    return mark;
  }

  // ---------- 生成 PDF ----------
  async function addPage(pdf, canvas, slice, plan, scale, marks) {
    var sw = canvas.width;
    var sy = Math.max(0, Math.round(slice.top * scale));
    var sh = Math.round((slice.bottom - slice.top) * scale);
    if (sy + sh > canvas.height) sh = canvas.height - sy;
    if (sh < 1) sh = 1;

    var pageCanvas = document.createElement('canvas');
    pageCanvas.width = Math.max(1, sw);
    pageCanvas.height = sh;
    var ctx = pageCanvas.getContext('2d');
    if (!ctx) throw new Error('浏览器无法创建画布，请换用 Chrome / Edge 再试。');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
    ctx.drawImage(canvas, 0, sy, sw, sh, 0, 0, sw, sh);

    var blob = await canvasToBlob(pageCanvas, 'image/jpeg', 0.92);
    var bytes = new Uint8Array(await blob.arrayBuffer());
    pageCanvas.width = 0;
    pageCanvas.height = 0;

    var image = await pdf.embedJpg(bytes);
    var pageWpt = plan.pageW * PT_PER_PX;
    var pageHpt = plan.pageH * PT_PER_PX;
    var sliceHpx = sh / scale;

    var page = pdf.addPage([pageWpt, pageHpt]);
    page.drawImage(image, {
      x: 0,
      y: pageHpt - (plan.bodyTop + sliceHpx) * PT_PER_PX,
      width: pageWpt,
      height: sliceHpx * PT_PER_PX
    });

    if (marks.header && plan.header) {
      var hd = plan.header;
      page.drawImage(marks.header.image, {
        x: hd.left * PT_PER_PX,
        y: pageHpt - (hd.top + hd.height) * PT_PER_PX,
        width: hd.width * PT_PER_PX,
        height: hd.height * PT_PER_PX
      });
    }
    if (marks.footer && plan.footer) {
      var ft = plan.footer;
      page.drawImage(marks.footer.image, {
        x: ft.left * PT_PER_PX,
        y: ft.bottomFromBottom * PT_PER_PX,
        width: ft.width * PT_PER_PX,
        height: ft.height * PT_PER_PX
      });
    }
  }

  async function convertSection(pdf, sec, plan, scale, marks, onPage) {
    try {
      marks.header = await embedHeaderFooter(pdf, plan.headerEl, scale, marks.cache);
    } catch (e) { marks.header = null; }
    try {
      marks.footer = await embedHeaderFooter(pdf, plan.footerEl, scale, marks.cache);
    } catch (e) { marks.footer = null; }

    var i = 0;
    while (i < plan.ranges.length) {
      var group = plan.ranges.slice(i, i + CHUNK_PAGES);
      var top = group[0].top;
      var bottom = group[group.length - 1].bottom;
      var canvas = await captureRegion(sec, plan.pageW, top, Math.max(1, bottom - top), scale);
      try {
        for (var g = 0; g < group.length; g++) {
          var slice = { top: group[g].top - top, bottom: group[g].bottom - top };
          await addPage(pdf, canvas, slice, plan, scale, marks);
          onPage();
          await tick();
        }
      } finally {
        canvas.width = 0;
        canvas.height = 0;
      }
      i += CHUNK_PAGES;
    }
  }

  async function convert() {
    if (state.busy || !state.file) return;

    state.busy = true;
    syncUI();
    renderFile();
    result.hidden = true;
    setProgress(0);
    setStatus('准备转换…', 'info');

    var scale = Number(qualitySel.value) || 2;
    var save = await requestSaveHandle(baseName(state.file.name) + '.pdf');
    if (save.canceled) {
      state.busy = false;
      syncUI();
      renderFile();
      setStatus('已取消保存。', 'info');
      setProgress(null);
      return;
    }

    try {
      if (!window.docx || typeof window.docx.renderAsync !== 'function') throw new Error('Word 解析引擎加载失败，请刷新页面重试。');
      if (!window.html2canvas) throw new Error('页面渲染引擎加载失败，请刷新页面重试。');
      if (!window.PDFLib || !window.PDFLib.PDFDocument) throw new Error('PDF 引擎加载失败，请刷新页面重试。');

      setStatus('正在解析 Word 文档…', 'info');
      host.innerHTML = '';
      var buffer = await state.file.arrayBuffer();
      await window.docx.renderAsync(buffer, host, null, DOCX_OPTIONS);
      await waitForImages(host);
      await tick();

      var sections = Array.prototype.slice.call(host.querySelectorAll('section.docx'));
      if (!sections.length) throw new Error('文档里没有可转换的页面内容。');

      setStatus('正在计算分页…', 'info');
      var plans = sections.map(function (sec) { return planSection(sec); });
      var grandTotal = plans.reduce(function (n, p) { return n + p.ranges.length; }, 0);
      if (!grandTotal) throw new Error('没有解析到任何页面。');
      await tick();

      var pdf = await window.PDFLib.PDFDocument.create();
      pdf.setProducer('PDF 工具箱');
      pdf.setTitle(baseName(state.file.name));

      var done = 0;
      var marks = { header: null, footer: null, cache: new Map() };
      for (var si = 0; si < plans.length; si++) {
        await convertSection(pdf, sections[si], plans[si], scale, marks, function () {
          done++;
          setStatus('正在生成 PDF：' + Math.min(done, grandTotal) + ' / ' + grandTotal + ' 页', 'info');
          setProgress(done / grandTotal);
        });
        await tick();
      }

      setStatus('正在打包 PDF…', 'info');
      var bytes = await pdf.save({ useObjectStreams: true });
      var blob = new Blob([bytes], { type: 'application/pdf' });
      var filename = baseName(state.file.name) + '.pdf';

      if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
      state.objectUrl = URL.createObjectURL(blob);
      downloadLink.href = state.objectUrl;
      downloadLink.download = filename;
      downloadLink.textContent = '重新下载（共 ' + grandTotal + ' 页，' + fmt(blob.size) + '）';
      result.hidden = false;
      setProgress(1);

      if (save.handle) {
        try {
          await writeToHandle(save.handle, blob);
          setStatus('已保存到所选位置：共 ' + grandTotal + ' 页，' + fmt(blob.size) + '。', 'success');
        } catch (writeErr) {
          setStatus('写入所选位置失败：' + (writeErr.message || writeErr) + '，请点下方链接下载。', 'error');
        }
      } else {
        downloadLink.click();
        setStatus('转换完成，共 ' + grandTotal + ' 页，' + fmt(blob.size) + '，已开始下载。', 'success');
      }
    } catch (err) {
      var message = String((err && err.message) || err);
      if (/encrypt|password/i.test(message)) {
        message = '文档看起来受密码保护，请先在 Word 里取消密码后再转换。';
      }
      setStatus('转换失败：' + message, 'error');
      setProgress(null);
    } finally {
      state.busy = false;
      host.innerHTML = '';
      syncUI();
      renderFile();
    }
  }

  // ---------- 交互 ----------
  dropzone.addEventListener('click', function () { if (!state.busy) input.click(); });
  input.addEventListener('change', function () {
    var file = input.files && input.files[0];
    input.value = '';
    if (file) acceptFile(file);
  });

  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); dragDepth = 0; dropzone.classList.remove('over'); });
  dropzone.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; if (!state.busy) dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', function (e) {
    e.preventDefault();
    dragDepth--;
    if (dragDepth <= 0) { dragDepth = 0; dropzone.classList.remove('over'); }
  });
  dropzone.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    dropzone.classList.remove('over');
    var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) acceptFile(file);
  });

  removeBtn.addEventListener('click', function () {
    if (state.busy) return;
    state.file = null;
    result.hidden = true;
    setStatus('', 'info');
    setProgress(null);
    renderFile();
  });

  clearBtn.addEventListener('click', function () {
    if (state.busy) return;
    state.file = null;
    result.hidden = true;
    setStatus('', 'info');
    setProgress(null);
    renderFile();
  });

  convertBtn.addEventListener('click', convert);

  window.addEventListener('pagehide', function () { if (state.objectUrl) URL.revokeObjectURL(state.objectUrl); });

  renderFile();
})();
</script>
<script src="/gate.js"></script>
<script>
requireAuth().then(function (ok) { if (ok) document.body.classList.remove('auth-gate'); });
</script>
<script src="/user-menu.js"></script>
