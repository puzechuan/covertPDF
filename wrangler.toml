name = "covert-pdf"
main = "src/index.js"
compatibility_date = "2026-11-26"

# 页面与图标由静态资源直接提供，Worker 只处理 /merge 与 /health。
[assets]
directory = "./public/"

# 让 Worker 以文本模块方式引入唯一的初始化 SQL
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "covertpdf-db"

[vars]

ADMIN_REGISTER_KEY_HASH = "212a3f535ec9614784856611b7ca9126774d1fe26ea69cba2c94e28164448387"

[observability]
enabled = true
